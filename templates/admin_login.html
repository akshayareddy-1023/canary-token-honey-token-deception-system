<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | CanaryShield</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-body"><div class="auth-card"><div class="brand-mark">🛡️</div><h1>CanaryShield</h1><p class="muted">Security Operations Console</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Administrator Username</label><input name="username" value="admin" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button class="primary-btn full">Sign in securely</button></form><p class="login-note">Authorized administrators only.</p></div></body></html>
